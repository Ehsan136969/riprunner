services:
  db:
    image: postgres:16
    container_name: riprunner-db
    environment:
      POSTGRES_USER: ${DB_USER:-root}
      POSTGRES_PASSWORD: ${DB_PASS:-changeme}
      POSTGRES_DB: ${DB_NAME:-postgres}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-root} -d ${DB_NAME:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  riprunner:
    build:
      context: .
      dockerfile: docker/2404/Dockerfile
    container_name: riprunner-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Tehran}
      APP_ENV: ${APP_ENV:-production}
      APP_URL: ${APP_URL:-http://localhost:8080}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-postgres}
      DB_USER: ${DB_USER:-root}
      DB_PASS: ${DB_PASS:-changeme}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-admin}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_DISPATCHER_USERNAME: ${SEED_DISPATCHER_USERNAME:-dispatcher}
      SEED_DISPATCHER_PASSWORD: ${SEED_DISPATCHER_PASSWORD:-}
    ports:
      - "8080:80"
